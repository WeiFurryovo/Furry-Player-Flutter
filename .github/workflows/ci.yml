name: CI (Artifacts)

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.8"
  EXPECTED_DART_VERSION: "3.10.7"

jobs:
  flutter-quality:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: ./apps/furry_flutter/scripts/flutter_doctor.sh

      - name: Verify Flutter quality gate
        run: ./apps/furry_flutter/scripts/flutter_quality_gate.sh

  android-debug:
    name: Android Debug APK (artifact)
    needs: [flutter-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: ./apps/furry_flutter/scripts/flutter_doctor.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK (sdkmanager)
        run: ./apps/furry_flutter/scripts/setup_android_ndk.sh

      - name: Build debug APK (no signing secrets needed)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          set -euxo pipefail
          mkdir -p dist/android/flutter
          ./apps/furry_flutter/scripts/build_android_flutter.sh debug dist/android/flutter 2>&1 | tee dist/android/flutter/android_debug_build.log

      - name: Checksums
        if: success()
        run: ./apps/furry_flutter/scripts/write_sha256_sums.sh dist/android/flutter/SHA256SUMS.txt dist/android/flutter/app-debug.apk

      - name: Upload artifact (android-debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            dist/android/flutter/app-debug.apk
            dist/android/flutter/android_debug_build.log
            dist/android/flutter/SHA256SUMS.txt

  linux-desktop:
    name: Linux Desktop (artifact)
    needs: [flutter-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps for Flutter desktop
        run: ./apps/furry_flutter/scripts/install_linux_desktop_deps.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: ./apps/furry_flutter/scripts/flutter_doctor.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build Linux desktop bundle
        run: |
          set -euxo pipefail
          mkdir -p dist/desktop/flutter/linux
          (
            ./apps/furry_flutter/scripts/build_linux_desktop_bundle.sh dist/desktop/flutter/linux
          ) 2>&1 | tee dist/desktop/flutter/linux/linux_desktop_build.log

      - name: Checksums
        if: success()
        run: ./apps/furry_flutter/scripts/write_sha256_sums.sh dist/desktop/flutter/linux/SHA256SUMS.txt dist/desktop/flutter/linux/furry_flutter_linux.tar.gz

      - name: Upload artifact (linux-desktop)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            dist/desktop/flutter/linux/furry_flutter_linux.tar.gz
            dist/desktop/flutter/linux/linux_desktop_build.log
            dist/desktop/flutter/linux/SHA256SUMS.txt

  windows-desktop:
    name: Windows Desktop (artifact)
    needs: [flutter-quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\flutter_doctor.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare Flutter app (Windows templates)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\prepare_flutter_app_windows.ps1

      - name: Cache Windows Pub/Cargokit
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
            apps/furry_flutter/furry_flutter_app/build/windows/x64/plugins/smtc_windows/cargokit_build/target
          key: ${{ runner.os }}-pub-cargokit-${{ hashFiles('apps/furry_flutter/deps_pins.txt', 'apps/furry_flutter/templates/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-cargokit-

      - name: Build Windows desktop bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\build_windows_desktop_bundle.ps1 -LogPath "dist\\desktop\\flutter\\windows\\windows_desktop_build.log"

      - name: Checksums
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\write_sha256_sums.ps1 -OutputFile "dist\desktop\flutter\windows\SHA256SUMS.txt" -Files "dist\desktop\flutter\windows\furry_flutter_windows.zip"

      - name: Upload artifact (windows-desktop)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/desktop/flutter/windows/furry_flutter_windows.zip
            dist/desktop/flutter/windows/windows_desktop_build.log
            dist/desktop/flutter/windows/SHA256SUMS.txt
