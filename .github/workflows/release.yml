name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.8"
  EXPECTED_DART_VERSION: "3.10.7"
  FURRY_MASTER_KEY_HEX: ${{ secrets.FURRY_MASTER_KEY_HEX }}
  FURRY_REQUIRE_MASTER_KEY: "1"

jobs:
  flutter-quality:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate release master key secret
        run: |
          set -euo pipefail
          if [ -z "${FURRY_MASTER_KEY_HEX:-}" ]; then
            echo "[ERROR] Missing required secret: FURRY_MASTER_KEY_HEX" >&2
            exit 1
          fi
          if ! printf '%s' "$FURRY_MASTER_KEY_HEX" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "[ERROR] FURRY_MASTER_KEY_HEX must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi

      - name: Flutter doctor
        run: ./apps/furry_flutter/scripts/flutter_doctor.sh

      - name: Verify Flutter quality gate
        run: ./apps/furry_flutter/scripts/flutter_quality_gate.sh

  rust-test:
    name: Rust Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps for Rust desktop/audio crates
        run: ./apps/furry_flutter/scripts/install_linux_desktop_deps.sh

      - name: Validate release master key secret
        run: |
          set -euo pipefail
          if [ -z "${FURRY_MASTER_KEY_HEX:-}" ]; then
            echo "[ERROR] Missing required secret: FURRY_MASTER_KEY_HEX" >&2
            exit 1
          fi
          if ! printf '%s' "$FURRY_MASTER_KEY_HEX" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "[ERROR] FURRY_MASTER_KEY_HEX must be exactly 64 hexadecimal characters" >&2
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run Rust workspace tests
        run: cargo test --workspace --all-targets

  android:
    name: Android (APK/AAB)
    needs: [flutter-quality, rust-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: ./apps/furry_flutter/scripts/flutter_doctor.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK (sdkmanager)
        run: ./apps/furry_flutter/scripts/setup_android_ndk.sh

      - name: Build Flutter Android (signed)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          ./apps/furry_flutter/scripts/build_android_flutter.sh release dist/android/flutter

      - name: Checksums
        run: ./apps/furry_flutter/scripts/write_sha256_sums.sh dist/android/flutter/SHA256SUMS.txt dist/android/flutter/app-*-release.apk dist/android/flutter/app-release.aab

      - name: Upload artifact (android)
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/android/flutter/app-*-release.apk
            dist/android/flutter/app-release.aab
            dist/android/flutter/SHA256SUMS.txt

  linux:
    name: Linux Desktop (Flutter bundle)
    needs: [flutter-quality, rust-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps for Flutter desktop
        run: ./apps/furry_flutter/scripts/install_linux_desktop_deps.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: ./apps/furry_flutter/scripts/flutter_doctor.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build Linux desktop bundle
        run: |
          set -euxo pipefail
          ./apps/furry_flutter/scripts/build_linux_desktop_bundle.sh dist/desktop/flutter/linux

      - name: Checksums
        run: ./apps/furry_flutter/scripts/write_sha256_sums.sh dist/desktop/flutter/linux/SHA256SUMS.txt dist/desktop/flutter/linux/furry_flutter_linux.tar.gz

      - name: Upload artifact (linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/desktop/flutter/linux/furry_flutter_linux.tar.gz
            dist/desktop/flutter/linux/SHA256SUMS.txt

  windows:
    name: Windows Desktop (Flutter bundle)
    needs: [flutter-quality, rust-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\flutter_doctor.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare Flutter app (Windows templates)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\prepare_flutter_app_windows.ps1

      - name: Cache Windows Pub/Cargokit
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
            apps/furry_flutter/furry_flutter_app/build/windows/x64/plugins/smtc_windows/cargokit_build/target
          key: ${{ runner.os }}-pub-cargokit-${{ hashFiles('apps/furry_flutter/deps_pins.txt', 'apps/furry_flutter/templates/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-cargokit-

      - name: Build Windows desktop bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\build_windows_desktop_bundle.ps1

      - name: Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\write_sha256_sums.ps1 -OutputFile "dist\desktop\flutter\windows\SHA256SUMS.txt" -Files "dist\desktop\flutter\windows\furry_flutter_windows.zip"

      - name: Upload artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/desktop/flutter/windows/furry_flutter_windows.zip
            dist/desktop/flutter/windows/SHA256SUMS.txt

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, linux, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          # Keep per-artifact subfolders to avoid filename collisions (e.g. multiple SHA256SUMS.txt).
          cp -a artifacts/. release-assets/
          find release-assets -type f -maxdepth 4 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
