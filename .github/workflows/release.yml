name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  flutter-quality:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v || true

      - name: Verify Flutter quality gate
        run: ./apps/furry_flutter/scripts/flutter_quality_gate.sh

  android:
    name: Android (APK/AAB)
    needs: [flutter-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK (sdkmanager)
        run: ./apps/furry_flutter/scripts/setup_android_ndk.sh

      - name: Build Flutter Android (signed)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          ./apps/furry_flutter/scripts/build_android_flutter.sh release dist/android/flutter

      - name: Checksums
        run: |
          set -euxo pipefail
          cd dist/android/flutter
          sha256sum app-*-release.apk app-release.aab > SHA256SUMS.txt

      - name: Upload artifact (android)
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/android/flutter/app-*-release.apk
            dist/android/flutter/app-release.aab
            dist/android/flutter/SHA256SUMS.txt

  linux:
    name: Linux Desktop (Flutter bundle)
    needs: [flutter-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps for Flutter desktop
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux desktop bundle
        run: |
          set -euxo pipefail
          ./apps/furry_flutter/scripts/build_linux_desktop_bundle.sh dist/desktop/flutter/linux

      - name: Checksums
        run: |
          set -euxo pipefail
          cd dist/desktop/flutter/linux
          sha256sum furry_flutter_linux.tar.gz > SHA256SUMS.txt

      - name: Upload artifact (linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/desktop/flutter/linux/furry_flutter_linux.tar.gz
            dist/desktop/flutter/linux/SHA256SUMS.txt

  windows:
    name: Windows Desktop (Flutter bundle)
    needs: [flutter-quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        shell: pwsh
        run: |
          flutter doctor -v

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare Flutter app (Windows templates)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\prepare_flutter_app_windows.ps1

      - name: Build Windows desktop bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\apps\furry_flutter\scripts\build_windows_desktop_bundle.ps1

      - name: Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd dist\desktop\flutter\windows
          $hash = (Get-FileHash furry_flutter_windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  furry_flutter_windows.zip" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Upload artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/desktop/flutter/windows/furry_flutter_windows.zip
            dist/desktop/flutter/windows/SHA256SUMS.txt

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, linux, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          # Keep per-artifact subfolders to avoid filename collisions (e.g. multiple SHA256SUMS.txt).
          cp -a artifacts/. release-assets/
          find release-assets -type f -maxdepth 4 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
